<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Naomi</title>
    <!-- Importamos una fuente bonita y romántica desde Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b090a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            perspective: 1000px;
        }

        /* --- Ventana Emergente (Modal) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .modal-box {
            background: #1a1616;
            border: 2px solid #b7094c;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 25px rgba(183, 9, 76, 0.5);
            max-width: 400px;
            width: 90%;
        }

        .modal-box h2 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .btn-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            height: 60px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-si {
            background-color: #b7094c;
            color: white;
            box-shadow: 0 0 10px rgba(183, 9, 76, 0.4);
        }

        #btn-si:hover {
            background-color: #a0063f;
            transform: scale(1.05);
        }

        #btn-no {
            background-color: #45373b;
            color: #a5a5a5;
            position: absolute;
            z-index: 1000;
            user-select: none;
        }

        /* --- Contenedor Principal (Flor y Mensaje) --- */
        .main-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        /* --- El Mensaje Romántico --- */
        .mensaje {
            font-family: 'Great Vibes', cursive;
            color: #f7a4b9;
            font-size: 3rem;
            margin-bottom: 40px;
            max-width: 800px;
            padding: 0 20px;
            line-height: 1.3;
            text-shadow: 0 0 15px rgba(247, 164, 185, 0.4);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* --- Escenario de la Rosa --- */
        .canvas {
            position: relative;
            width: 300px;
            height: 400px;
        }

        /* La Cúpula de Cristal */
        .cupula {
            position: absolute;
            width: 220px;
            height: 350px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-bottom: none;
            border-radius: 110px 110px 0 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
            box-shadow: inset 0 20px 30px rgba(255, 255, 255, 0.05), 0 0 20px rgba(255, 255, 255, 0.05);
            z-index: 5;
        }

        .cupula::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Base de madera */
        .base {
            position: absolute;
            width: 260px;
            height: 20px;
            background: #2b1d1d;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6);
            z-index: 4;
        }

        /* Tallo */
        .tallo {
            position: absolute;
            width: 6px;
            height: 180px;
            background-color: #1a4314;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);
            border-radius: 3px;
        }

        /* Hojas */
        .hoja {
            position: absolute;
            width: 30px;
            height: 15px;
            background-color: #245c1c;
            border-radius: 15px 0;
        }

        .hoja.izquierda {
            left: -25px;
            top: 60px;
            transform: rotate(-20deg);
        }

        .hoja.derecha {
            right: -25px;
            top: 100px;
            transform: rotate(50deg) scaleY(-1);
        }

        /* --- Pétalos de la Rosa --- */
        .petalo {
            position: absolute;
            background: linear-gradient(135deg, #ff0a54, #b7094c);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.3), 0 0 10px rgba(183, 9, 76, 0.3);
            transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1), top 4s cubic-bezier(0.25, 1, 0.5, 1), opacity 3.5s;
        }

        /* Centro de la flor */
        .p1 { width: 45px; height: 45px; top: 180px; left: 128px; z-index: 3; }
        .p2 { width: 50px; height: 50px; top: 178px; left: 115px; z-index: 2; transform: rotate(-15deg); }
        .p3 { width: 50px; height: 50px; top: 178px; left: 135px; z-index: 2; transform: rotate(15deg); }
        
        /* Pétalos intermedios (Los que caerán) */
        .p4 { width: 55px; height: 50px; top: 185px; left: 110px; z-index: 1; transform: rotate(-30deg); }
        .p5 { width: 55px; height: 50px; top: 185px; left: 135px; z-index: 1; transform: rotate(30deg); }
        
        /* Pétalos externos (Los que caerán después) */
        .p6 { width: 60px; height: 52px; top: 192px; left: 105px; z-index: 1; transform: rotate(-45deg); }
        .p7 { width: 60px; height: 52px; top: 192px; left: 135px; z-index: 1; transform: rotate(45deg); }

        /* Estado "Caído" provocado por JavaScript */
        .petalo.caido-1 {
            top: 325px !important;
            transform: translateY(0) rotate(85deg) !important;
        }
        .petalo.caido-2 {
            top: 328px !important;
            transform: translateY(0) rotate(-70deg) !important;
        }
        .petalo.caido-3 {
            top: 330px !important;
            transform: translateY(0) rotate(40deg) !important;
        }
        .petalo.caido-4 {
            top: 327px !important;
            transform: translateY(0) rotate(-55deg) !important;
        }

        /* Destellos de magia */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0a54, 0 0 12px #fff;
            animation: flicker 2s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
            50% { opacity: 0.8; transform: translateY(-20px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Ventana de Pregunta Inicial -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2>Naomi, ¿quieres una rosa?</h2>
            <div class="btn-container">
                <button class="btn" id="btn-si">Sí</button>
                <button class="btn" id="btn-no">No</button>
            </div>
        </div>
    </div>

    <!-- Contenido Principal Oculto al inicio -->
    <div class="main-container" id="main-content">
        <div class="mensaje">
            Recuerda que eres increíble y una mujer extremadamente bella
        </div>
        
        <div class="canvas">
            <div class="cupula"></div>
            <div class="tallo">
                <div class="hoja izquierda"></div>
                <div class="hoja derecha"></div>
            </div>
            <!-- Pétalos de la rosa -->
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4" id="falling-1"></div>
            <div class="petalo p5" id="falling-2"></div>
            <div class="petalo p6" id="falling-3"></div>
            <div class="petalo p7" id="falling-4"></div>
            <div class="base"></div>

            <!-- Destellos mágicos decorativos -->
            <div class="sparkle" style="top: 170px; left: 140px; animation-delay: 0s;"></div>
            <div class="sparkle" style="top: 200px; left: 110px; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="top: 220px; left: 180px; animation-delay: 1s;"></div>
            <div class="sparkle" style="top: 250px; left: 150px; animation-delay: 1.5s;"></div>
        </div>
    </div>

    <script>
